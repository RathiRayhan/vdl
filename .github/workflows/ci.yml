name: CI

on:
  push:
    branches: [main, termux]
  pull_request:
    branches: [main, termux]

# A newer push supersedes any still-running workflow for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          # Preinstalled on ubuntu-latest; fall back to apt only if missing.
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y -qq --no-install-recommends shellcheck
          fi
          shellcheck --version | head -1

      - name: ShellCheck
        run: |
          shellcheck --shell=bash bin/vdl install.sh test/smoke.sh test/unit.sh \
            lib/vdl/ui.sh lib/vdl/helpers.sh lib/vdl/images.sh lib/vdl/downloads.sh \
            lib/vdl/args.sh lib/vdl/settings.sh lib/vdl/collect.sh lib/vdl/paths.sh \
            lib/vdl/classify.sh lib/vdl/ytdlp.sh lib/vdl/plan.sh
          shellcheck completions/vdl.bash
          # zsh and fish completions use syntax that shellcheck's bash mode
          # cannot parse; they are verified by manual review and smoke tests.

      - name: Smoke tests
        run: |
          bash test/smoke.sh

      - name: Unit tests
        run: |
          bash test/unit.sh

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install real tools
        run: |
          # yt-dlp and a static ffmpeg/ffprobe both come from PyPI, so no
          # apt mirror is involved at all (aria2c and zip ship with the
          # runner image).
          export PATH="$HOME/.local/bin:$PATH"
          python3 -m pip install --user --quiet --no-input yt-dlp static-ffmpeg
          FF="$(python3 -c 'from static_ffmpeg import run; print(run.get_or_fetch_platform_executables_else_raise()[0])')"
          dirname "$FF" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          yt-dlp --version
          aria2c --version | head -1
          ffmpeg -version | head -1

      - name: Integration tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash test/integration.sh
