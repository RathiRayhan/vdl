name: CI

on:
  push:
    branches: [main, termux]
  pull_request:
    branches: [main, termux]

# A newer push supersedes any still-running workflow for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The integration job posts a debug comment on failure.
permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          # Preinstalled on ubuntu-latest; fall back to apt only if missing.
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y -qq --no-install-recommends shellcheck
          fi
          shellcheck --version | head -1

      - name: ShellCheck
        run: |
          shellcheck --shell=bash bin/vdl install.sh test/smoke.sh test/unit.sh \
            lib/vdl/ui.sh lib/vdl/helpers.sh lib/vdl/images.sh lib/vdl/downloads.sh \
            lib/vdl/gallery.sh lib/vdl/args.sh lib/vdl/settings.sh lib/vdl/collect.sh lib/vdl/paths.sh \
            lib/vdl/classify.sh lib/vdl/ytdlp.sh lib/vdl/plan.sh
          shellcheck completions/vdl.bash
          # zsh and fish completions use syntax that shellcheck's bash mode
          # cannot parse; they are verified by manual review and smoke tests.

      - name: Smoke tests
        run: |
          bash test/smoke.sh

      - name: Unit tests
        run: |
          bash test/unit.sh

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install real tools
        run: |
          {
            # yt-dlp and a static ffmpeg/ffprobe live in a venv at a fixed
            # path: the suite runs downloads under an isolated HOME, which
            # hides pip --user modules and broke media downloads.  A venv's
            # scripts carry absolute shebangs, so they keep working.  The
            # runner's python3 may lack ensurepip, so fall back to virtualenv.
            python3 -m venv /home/runner/vdl-tools || {
              python3 -m pip install --user --quiet --no-input virtualenv
              python3 -m virtualenv /home/runner/vdl-tools
            }
            export PATH="/home/runner/vdl-tools/bin:$PATH"
            pip install --quiet --no-input yt-dlp static-ffmpeg
            FF="$(python -c 'from static_ffmpeg import run; print(run.get_or_fetch_platform_executables_else_raise()[0])')"
            export PATH="$(dirname "$FF"):$PATH"
            dirname "$FF" >> "$GITHUB_PATH"
            echo "/home/runner/vdl-tools/bin" >> "$GITHUB_PATH"
            yt-dlp --version
            aria2c --version | head -1
            ffmpeg -version | head -1
          } > /tmp/install-out.log 2>&1
          rc=$?
          tail -n 40 /tmp/install-out.log
          exit $rc

      - name: Integration tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          VDL_INT_KEEP=1 bash test/integration.sh > /tmp/int-out.log 2>&1 || {
            rc=$?
            cat /tmp/int-out.log
            exit $rc
          }

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'install step output:'
            tail -n 30 /tmp/install-out.log 2>/dev/null || true
            echo
            echo 'integration step output:'
            tail -n 80 /tmp/int-out.log 2>/dev/null || true
            echo
            echo 'last vdl log:'
            LOG=$(ls -td /tmp/tmp.* 2>/dev/null | head -1)/last.log
            tail -n 30 "$LOG" 2>/dev/null || true
          } > /tmp/int-report.txt
          python3 - "${{ github.sha }}" <<'PY'
          import json, os, sys, urllib.request
          body = open("/tmp/int-report.txt").read()[-6000:]
          req = urllib.request.Request(
              "https://api.github.com/repos/RathiRayhan/vdl/commits/" + sys.argv[1] + "/comments",
              data=json.dumps({"body": "CI integration failure:\n\n```\n" + body + "\n```"}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          urllib.request.urlopen(req)
          PY
