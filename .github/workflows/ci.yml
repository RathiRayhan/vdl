name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: |
          shellcheck --shell=bash bin/vdl install.sh test/smoke.sh
          shellcheck completions/vdl completions/vdl.fish completions/_vdl || true

      - name: Smoke tests
        run: |
          bash test/smoke.sh
