name: CI

on:
  push:
    branches: [main, termux]
  pull_request:
    branches: [main, termux]

# A newer push supersedes any still-running workflow for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The integration job posts a debug comment on failure.
permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          # Preinstalled on ubuntu-latest; fall back to apt only if missing.
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y -qq --no-install-recommends shellcheck
          fi
          shellcheck --version | head -1

      - name: ShellCheck
        run: |
          shellcheck --shell=bash bin/vdl install.sh test/smoke.sh test/unit.sh \
            lib/vdl/ui.sh lib/vdl/helpers.sh lib/vdl/images.sh lib/vdl/downloads.sh \
            lib/vdl/args.sh lib/vdl/settings.sh lib/vdl/collect.sh lib/vdl/paths.sh \
            lib/vdl/classify.sh lib/vdl/ytdlp.sh lib/vdl/plan.sh
          shellcheck completions/vdl.bash
          # zsh and fish completions use syntax that shellcheck's bash mode
          # cannot parse; they are verified by manual review and smoke tests.

      - name: Smoke tests
        run: |
          bash test/smoke.sh

      - name: Unit tests
        run: |
          bash test/unit.sh

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install real tools
        run: |
          # yt-dlp and a static ffmpeg/ffprobe both come from PyPI, so no
          # apt mirror is involved at all (aria2c and zip ship with the
          # runner image).
          export PATH="$HOME/.local/bin:$PATH"
          python3 -m pip install --user --quiet --no-input yt-dlp static-ffmpeg
          FF="$(python3 -c 'from static_ffmpeg import run; print(run.get_or_fetch_platform_executables_else_raise()[0])')"
          dirname "$FF" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          yt-dlp --version
          aria2c --version | head -1
          ffmpeg -version | head -1

      - name: Integration tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          VDL_INT_KEEP=1 bash test/integration.sh > /tmp/int-out.log 2>&1 || {
            rc=$?
            cat /tmp/int-out.log
            exit $rc
          }

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'FAIL lines:'
            grep -a '^FAIL' /tmp/int-out.log | head -20 || true
            echo
            echo 'last vdl log:'
            LOG=$(ls -td /tmp/tmp.* 2>/dev/null | head -1)/last.log
            tail -n 40 "$LOG" 2>/dev/null || true
          } > /tmp/int-report.txt
          python3 - "${{ github.sha }}" <<'PY'
          import json, os, sys, urllib.request
          body = open("/tmp/int-report.txt").read()[-6000:]
          req = urllib.request.Request(
              "https://api.github.com/repos/RathiRayhan/vdl/commits/" + sys.argv[1] + "/comments",
              data=json.dumps({"body": "CI integration failure:\n\n```\n" + body + "\n```"}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          urllib.request.urlopen(req)
          PY
