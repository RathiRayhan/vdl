name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version
        run: |
          version=$(./bin/vdl --version | awk '{print $2}')
          changelog=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          if [[ ${GITHUB_REF_NAME:-} != "v$version" || $version != "$changelog" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME:-}, VDL_VERSION $version, and CHANGELOG $changelog do not match"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          gh release create "$tag" --title "$tag" --generate-notes
